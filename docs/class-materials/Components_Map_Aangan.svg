<rect x="145.0" y="73.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="230" y="92.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Calls the studio</text>
<text x="230" y="105.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">at any time</text>
<rect x="355.0" y="73.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="440" y="85.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Tells us about the</text>
<text x="440" y="99.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">project: place, size,</text>
<text x="440" y="112.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">timing, who decides</text>
<rect x="1025.0" y="73.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1110" y="92.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Hears who will call,</text>
<text x="1110" y="105.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">when, and a thank you</text>
<rect x="145.0" y="151.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="230" y="170.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Answers right away,</text>
<text x="230" y="183.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">any time of day</text>
<rect x="355.0" y="151.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="440" y="170.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Asks the questions;</text>
<text x="440" y="183.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">never asks about budget</text>
<rect x="575.0" y="151.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="660" y="170.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Checks the studio's</text>
<text x="660" y="183.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">rules and urgency</text>
<rect x="805.0" y="151.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="890" y="170.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Complaint? Good fit?</text>
<text x="890" y="183.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">How urgent?</text>
<rect x="1025.0" y="151.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1110" y="170.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Books a time and</text>
<text x="1110" y="183.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">tells the caller who</text>
<rect x="575.0" y="229.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="660" y="241.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">What we do, who we</text>
<text x="660" y="255.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">take on, and the</text>
<text x="660" y="268.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">no-pricing rule</text>
<rect x="805.0" y="307.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="890" y="326.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Helps with calls</text>
<text x="890" y="339.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">that are not clear</text>
<rect x="1225.0" y="307.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1310" y="326.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Writes a short note</text>
<text x="1310" y="339.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">for the designer</text>
<rect x="805.0" y="385.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="890" y="397.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Picks the next</text>
<text x="890" y="411.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">designer in turn;</text>
<text x="890" y="424.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">skips if busy</text>
<rect x="1025.0" y="385.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1110" y="404.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Call goes into the</text>
<text x="1110" y="417.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">designer's calendar</text>
<rect x="1225.0" y="463.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1310" y="475.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Sends the designer</text>
<text x="1310" y="489.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">the lead, how urgent,</text>
<text x="1310" y="502.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">and call-by time</text>
<rect x="1225.0" y="541.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1310" y="560.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Calls the customer;</text>
<text x="1310" y="573.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">updates the status</text>
<rect x="805.0" y="619.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="890" y="631.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Logs every call:</text>
<text x="890" y="645.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">status, summary;</text>
<text x="890" y="658.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">recordings in Vaani</text>
<rect x="1225.0" y="619.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1310" y="638.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Front desk and</text>
<text x="1310" y="651.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">designers see it</text>
<rect x="805.0" y="697.0" width="170" height="52" fill="#FBEFEA" stroke="#222"/>
<text x="890" y="716.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Handles complaints;</text>
<text x="890" y="729.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">checks declined calls</text>
<rect x="145.0" y="775.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="230" y="794.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Starts a record</text>
<text x="230" y="807.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">with the call text</text>
<rect x="805.0" y="775.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="890" y="787.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Keeps the record</text>
<text x="890" y="801.0" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">up to date; adds up</text>
<text x="890" y="814.5" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">costs and sales</text>
<rect x="1225.0" y="775.0" width="170" height="52" fill="#fff" stroke="#222"/>
<text x="1310" y="794.25" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">Founder's view:</text>
<text x="1310" y="807.75" font-size="11.5" fill="#111" text-anchor="middle" dominant-baseline="central">sales and costs</text>
<text x="20" y="864" font-size="11.5" fill="#333">Four outputs: Telegram message and calendar booking (to the designer), the dashboard (front desk and designers), HubSpot (founder).</text>
