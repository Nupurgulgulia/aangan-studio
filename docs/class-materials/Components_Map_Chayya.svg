<text x="657" y="402" font-size="13" font-weight="800" fill="#1d2b44">Loaded before each call</text>
<text x="657" y="420" font-size="11.2" fill="#3b4760">What we do and don’t, Pune +</text>
<text x="657" y="435" font-size="11.2" fill="#3b4760">PCMC only, 6-week minimum,</text>
<text x="657" y="450" font-size="11.2" fill="#3b4760">Nikhil’s 5 criteria.</text>
<rect x="753" y="474" width="64" height="18" rx="4" fill="#c8323a"/>
<text x="785" y="487" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">THE CUT</text>
