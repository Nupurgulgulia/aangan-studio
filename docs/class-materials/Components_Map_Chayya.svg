<text x="235" y="150.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">1</text>
<text x="245" y="166" font-size="13" font-weight="800" fill="#1d2b44">Calls the studio phone</text>
<text x="245" y="184" font-size="11.2" fill="#3b4760">Any hour, day or night.</text>
<text x="245" y="199" font-size="11.2" fill="#3b4760">Often after Instagram or</text>
<text x="245" y="214" font-size="11.2" fill="#3b4760">a referral.</text>
<rect x="437" y="260" width="184" height="98" rx="8" fill="#fff" stroke="#e0852b" stroke-width="2"/>
<circle cx="441" cy="264" r="12" fill="#e0852b"/>
<text x="441" y="268.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">2</text>
<text x="451" y="284" font-size="13" font-weight="800" fill="#1d2b44">Answers in seconds</text>
<text x="451" y="302" font-size="11.2" fill="#3b4760">English by default; Hindi or</text>
<text x="451" y="317" font-size="11.2" fill="#3b4760">Marathi only if the caller</text>
<text x="451" y="332" font-size="11.2" fill="#3b4760">speaks it. Never repeats itself.</text>
