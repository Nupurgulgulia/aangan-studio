<circle cx="1059" cy="500" r="12" fill="#7b55d6"/>
<text x="1059" y="504.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">4</text>
<text x="1069" y="520" font-size="13" font-weight="800" fill="#1d2b44">Asks, reads back, decides</text>
<text x="1069" y="538" font-size="11.2" fill="#3b4760">One question at a time, a to g.</text>
<text x="1069" y="553" font-size="11.2" fill="#3b4760">Never guesses, never quotes</text>
<text x="1069" y="568" font-size="11.2" fill="#3b4760">a price. Book, decline, escalate.</text>
<rect x="849" y="614" width="184" height="98" rx="8" fill="#fff" stroke="#e0852b" stroke-width="2"/>
<circle cx="853" cy="618" r="12" fill="#e0852b"/>
<text x="853" y="622.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">5</text>
<text x="863" y="638" font-size="13" font-weight="800" fill="#1d2b44">Rules decide the details</text>
<text x="863" y="656" font-size="11.2" fill="#3b4760">Area check · tier Hot / Priority /</text>
<text x="863" y="671" font-size="11.2" fill="#3b4760">Standard · call-by deadline ·</text>
<text x="863" y="686" font-size="11.2" fill="#3b4760">next designer, free 30-min slot.</text>
<rect x="1261" y="732" width="184" height="98" rx="8" fill="#fff" stroke="#13897d" stroke-width="2"/>
<circle cx="1265" cy="736" r="12" fill="#13897d"/>
<text x="1265" y="740.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">6</text>
<text x="1275" y="756" font-size="13" font-weight="800" fill="#1d2b44">Brief emailed to designer</text>
<text x="1275" y="774" font-size="11.2" fill="#3b4760">Tier, call-by time, every answer,</text>
<text x="1275" y="789" font-size="11.2" fill="#3b4760">link to the call. Escalations:</text>
<text x="1275" y="804" font-size="11.2" fill="#3b4760">senior called back in 15 min.</text>
<rect x="1261" y="850" width="184" height="98" rx="8" fill="#fff" stroke="#13897d" stroke-width="2"/>
<circle cx="1265" cy="854" r="12" fill="#13897d"/>
<text x="1265" y="858.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">7</text>
<text x="1275" y="874" font-size="13" font-weight="800" fill="#1d2b44">Designer works the lead</text>
<text x="1275" y="892" font-size="11.2" fill="#3b4760">Call-by countdown, calendar,</text>
<text x="1275" y="907" font-size="11.2" fill="#3b4760">accept → called → held →</text>
<text x="1275" y="922" font-size="11.2" fill="#3b4760">proposal → won.</text>
<rect x="1317" y="946" width="120" height="18" rx="4" fill="#2f6fd6"/>
<text x="1377" y="959" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">HUMAN CHECKPOINT</text>
