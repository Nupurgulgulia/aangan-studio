<text x="1275" y="1110" font-size="13" font-weight="800" fill="#1d2b44">Every booking is a deal</text>
<text x="1275" y="1128" font-size="11.2" fill="#3b4760">Contact + deal with tier, source,</text>
<text x="1275" y="1143" font-size="11.2" fill="#3b4760">designer. Status moves the</text>
<text x="1275" y="1158" font-size="11.2" fill="#3b4760">deal stage. Value on won.</text>
<rect x="1261" y="142" width="184" height="98" rx="8" fill="#fff" stroke="#13897d" stroke-width="2"/>
<circle cx="1265" cy="146" r="12" fill="#13897d"/>
<text x="1265" y="150.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">10</text>
<text x="1275" y="166" font-size="13" font-weight="800" fill="#1d2b44">Hears who calls, when</text>
<text x="1275" y="184" font-size="11.2" fill="#3b4760">"Aryan will call you Monday</text>
<text x="1275" y="199" font-size="11.2" fill="#3b4760">at 10." WhatsApp confirmation</text>
<text x="1275" y="214" font-size="11.2" fill="#3b4760">saved (not connected yet).</text>
