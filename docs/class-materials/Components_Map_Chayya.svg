<text x="46" y="1300" font-size="12" font-style="italic" fill="#cbd3e1">Founder · two views</text>
<text x="244" y="1246" font-size="13" font-weight="700" fill="#1d2b44">Nikhil never pulls numbers by hand again. Two views, each doing one job:</text>
<rect x="244" y="1258" width="582" height="82" rx="8" fill="#f6f8fb"/>
<text x="258" y="1278" font-size="12" font-weight="800" fill="#d0611f">HUBSPOT – EVERY DEAL, PIPELINE &amp; REVENUE</text>
<text x="258" y="1298" font-size="11.5" fill="#3b4760">Deal per booking with tier, source, designer · stage moves with the designer ·</text>
<text x="258" y="1314" font-size="11.5" fill="#3b4760">won value on close · dashboard: deals by stage, won vs lost, closed, created ·</text>
<text x="258" y="1330" font-size="11.5" fill="#3b4760">saved view "Aangan leads" with tier / designer / source columns.</text>
<rect x="850" y="1258" width="582" height="82" rx="8" fill="#f6f8fb"/>
<text x="864" y="1278" font-size="12" font-weight="800" fill="#13897d">FOUNDER VIEW IN THE APP (nikhil login) – SPEED &amp; COST</text>
<text x="864" y="1298" font-size="11.5" fill="#3b4760">Calls answered · qualified % · won and won value · hot leads booked late ·</text>
<text x="864" y="1314" font-size="11.5" fill="#3b4760">pipeline by stage, tier, source, designer · won value by month ·</text>
<text x="864" y="1330" font-size="11.5" fill="#3b4760">voice minutes, cost of the agent, cost per qualified lead.</text>
