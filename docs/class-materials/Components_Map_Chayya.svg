<circle cx="1265" cy="972" r="12" fill="#2f6fd6"/>
<text x="1265" y="976.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">8</text>
<text x="1275" y="992" font-size="13" font-weight="800" fill="#1d2b44">Every decline is reviewed</text>
<text x="1275" y="1010" font-size="11.2" fill="#3b4760">Same day. "Looks right" or</text>
<text x="1275" y="1025" font-size="11.2" fill="#3b4760">reverse: booked as Hot with</text>
<text x="1275" y="1040" font-size="11.2" fill="#3b4760">the next designer.</text>
